name: SEO Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # weekly, Monday 8am UTC

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml requests
      - run: python scripts/seo_check.py
      - name: Commit SEO results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/seo/
          git diff --staged --quiet || git commit -m "Update SEO check results"
          git push
