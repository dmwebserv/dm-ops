name: Social Drafts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 1 * *'  # monthly, 1st at 9am UTC - same cadence as other reports

permissions:
  contents: write

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml requests
      - run: python scripts/generate_social_drafts.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit social drafts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Generate social content drafts"
          for attempt in 1 2 3; do
            git push && break
            echo "Push rejected (attempt $attempt/3) - fetching and rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            if [ "$attempt" = "3" ]; then
              echo "::error::git push failed after 3 attempts"
              exit 1
            fi
          done
