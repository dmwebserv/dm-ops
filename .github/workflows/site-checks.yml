name: Site Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml requests
      - run: python scripts/check_sites.py
      - run: python scripts/notify.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/latest.json logs/history/
          git diff --staged --quiet || git commit -m "Update site check results"
          for attempt in 1 2 3; do
            git push && break
            echo "Push rejected (attempt $attempt/3) - fetching and rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            if [ "$attempt" = "3" ]; then
              echo "::error::git push failed after 3 attempts"
              exit 1
            fi
          done

